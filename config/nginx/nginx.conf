worker_processes  1;

events {
  worker_connections  1024;
}

http {
  server {
    listen 80;
    server_name   _;

    root   /usr/share/nginx/html;
    index  index.html index.htm;
    include /etc/nginx/mime.types;

    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers. Keep in sync with public/_headers (Cloudflare)
    # and netlify.toml [[headers]]. See public/_headers for the CSP
    # domain inventory and the documented 'unsafe-inline' trade-off.
    # `always` sends the headers on error responses (e.g. the 404 page)
    # as well as successful ones.
    # NO HSTS here on purpose: this container listens on port 80 only
    # (no TLS listener), and HSTS must only be served over HTTPS.
    # Terminate TLS in front of this container (reverse proxy / load
    # balancer) and add Strict-Transport-Security there instead.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://media.csofts.tech https://i.ytimg.com; media-src 'self' https://media.csofts.tech https://www.w3schools.com; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self' https://formspree.io https://getform.io; frame-ancestors 'self'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    error_page 404 /404.html;
    location = /404.html {
            root /usr/share/nginx/html;
            internal;
    }

    location / {
            try_files $uri ${uri}.html $uri/index.html =404;
    }
  }
}
