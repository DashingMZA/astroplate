name: Content dates

# Stamps `dateModified` on content edited through the GitHub web UI (or
# any push that bypasses the local pre-commit hook). Runs the same
# script as the hook, scoped to the pushed range, and commits the
# result back. Loop protection: the commit message carries `[skip ci]`
# (skips every push-triggered workflow, including this one) and the
# job does not run for pushes made by the bot itself.
on:
  push:
    branches: ["main"]
    paths:
      - "src/content/**"

permissions:
  contents: write

jobs:
  stamp:
    name: Stamp content dates
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: the script diffs against the pushed base and
          # recovers creation dates from git history.
          fetch-depth: 0
      - name: Setup pnpm
        # No `version:` input here: package.json already pins the pnpm
        # version via `packageManager`, and pnpm/action-setup v6 errors
        # out when both are set ("Multiple versions of pnpm specified").
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Stamp dates for the pushed range
        run: node scripts/manage-content-dates.mjs --since ${{ github.event.before }} --stage
      - name: Commit back when dates changed
        run: |
          if git diff --cached --quiet; then
            echo "No date changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(content-dates): update dateModified [skip ci]"
          git push
